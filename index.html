<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><meta name="description" content="Convert everyday units for length, mass, area, volume, speed, temperature and digital storage."><title>UnitWise</title><style>body{margin:0;background:#0b1020;color:#edf2ff;font:15px system-ui}main{max-width:1050px;margin:auto;padding:25px 18px}header{color:#a5b4fc;display:flex;justify-content:space-between;font-weight:800}.hero{padding:28px 0}.hero h1{font-size:40px}.muted,small{color:#9aa8c3}.layout{display:grid;grid-template-columns:250px 1fr;gap:14px}.panel{background:#151e31;border:1px solid #30405a;border-radius:15px;padding:16px}.stack{display:grid;gap:11px}button,input,select,textarea{font:inherit}button{background:#a5b4fc;color:#111827;border:0;border-radius:9px;padding:10px;cursor:pointer;font-weight:700}button.secondary{background:#30405a;color:white}input,select,textarea{background:#0e1729;color:white;border:1px solid #394a65;border-radius:8px;padding:10px;width:100%;box-sizing:border-box}label{display:grid;gap:5px;color:#b4c0d4;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.item{border:1px solid #394a65;padding:10px;border-radius:9px;margin:7px 0}footer{text-align:center;color:#8997b0;padding:25px}@media(max-width:700px){.layout{grid-template-columns:1fr}.hero h1{font-size:33px}}</style></head><body><main><header><span>ERROR404DTIR / OPEN SOURCE</span><small>LOCAL · FREE · NO BUILD</small></header><section class="hero"><small>SMALL TOOL / BIG UTILITY</small><h1>UnitWise</h1><p class="muted">Convert everyday units for length, mass, area, volume, speed, temperature and digital storage.</p></section><div class="row"><label>Category<select id="cat"><option>Length</option><option>Mass</option><option>Area</option><option>Volume</option><option>Speed</option><option>Data</option><option>Temperature</option></select></label><label>Value<input id="v" type="number" value="1"></label></div><div class="row"><label>From<select id="a"></select></label><label>To<select id="b"></select></label></div><div class="panel"><small>Result</small><h1 id="out">—</h1><button id="swap">Swap units</button></div><footer>Runs locally in your browser · No account required</footer></main><script>const $=x=>document.getElementById(x),U={Length:{m:1,km:1000,cm:.01,mm:.001,ft:.3048,in:.0254,mile:1609.344},Mass:{kg:1,g:.001,mg:.000001,lb:.45359237,oz:.0283495},Area:{'m²':1,'km²':1e6,'cm²':.0001,'ft²':.092903,acre:4046.856},Volume:{L:1,mL:.001,'m³':1000,'US gal':3.78541,cup:.236588},Speed:{'m/s':1,'km/h':1/3.6,mph:.44704,knot:.514444},Data:{bit:1,byte:8,KB:8000,MB:8e6,GB:8e9,KiB:8192,MiB:8388608},Temperature:{'°C':0,'°F':1,K:2}};function cv(v,a,b,c){if(c==='Temperature'){let k=a==='°C'?v+273.15:a==='°F'?(v-32)*5/9+273.15:v;return b==='°C'?k-273.15:b==='°F'?(k-273.15)*9/5+32:k}return v*U[c][a]/U[c][b]}function setup(){let c=$('cat').value,k=Object.keys(U[c]);$('a').innerHTML=k.map(x=>'<option>'+x+'</option>').join('');$('b').innerHTML=k.map(x=>'<option>'+x+'</option>').join('');$('b').selectedIndex=1;calc()}function calc(){let c=$('cat').value,r=cv(+$('v').value,$('a').value,$('b').value,c);$('out').textContent=(Number.isFinite(r)?Number(r.toPrecision(10)):'—')+' '+$('b').value}$('cat').onchange=setup;['v','a','b'].forEach(k=>$(k).oninput=calc);$('swap').onclick=()=>{let x=$('a').value;$('a').value=$('b').value;$('b').value=x;calc()};setup();</script></body></html>
